[project]
name = "tsdb"
version = "0.1.0"
description = "Time-series metrics service: OpenTSDB-style ingest/query API on ClickHouse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30",
  "clickhouse-connect[async]>=1.13",
  "fastapi>=0.115",
  "orjson>=3.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.18",
  "uvicorn[standard]>=0.32",
  "xxhash>=3.5",
]

[project.scripts]
tsdb-migrate = "tsdb.migrate:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
