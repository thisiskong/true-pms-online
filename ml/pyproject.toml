[project]
name = "pms-ml"
version = "0.1.0"
description = "Fiber quality scoring for ONUs (PMS)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.1",
  "lightgbm>=4.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6",
  "scipy>=1.12",
  "psycopg[binary]>=3.1",
]

[tool.uv]
package = false
