[project]
name = "pms-online-ml"
version = "0.1.0"
description = "FTTx ML prototype — synthetic telemetry, anomaly/budget/bend detectors, Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "streamlit>=1.30",
    "plotly>=5.18",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["generate_data.py", "models.py", "app.py"]

[tool.ruff]
line-length = 100
