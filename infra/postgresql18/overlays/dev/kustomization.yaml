apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pmsonline-dev-pg18

resources:
  - ../../base
  - namespace.yaml
  - secret-pmsonline-credentials.yaml

patches:
  - path: cluster-patch.yaml
    target:
      kind: Cluster
      name: pg18-pms
  - path: service-external-patch.yaml
    target:
      kind: Service
      name: pg18-pms-external
