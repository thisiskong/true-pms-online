apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg18-pms
spec:
  # Replace with the real image you built/pushed from ../../Dockerfile.
  imageName: <REGISTRY_PLACEHOLDER>/pg18-postgis-tsdb:18
  instances: 1
  storage:
    size: 20Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
