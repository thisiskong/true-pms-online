# CloudNativePG Cluster — shared skeleton for both dev and prod.
# Environment-specific fields (imageName, instances, storage, resources, affinity)
# are overridden per overlay via cluster-patch.yaml — see overlays/{dev,prd}/.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg18-pms
spec:
  # Placeholder — overridden per overlay. Build/push your own image from ../Dockerfile
  # and replace <REGISTRY_PLACEHOLDER> here and in both overlays' cluster-patch.yaml.
  imageName: <REGISTRY_PLACEHOLDER>/pg18-postgis-tsdb:18

  instances: 1 # overridden per overlay

  postgresql:
    # timescaledb and pg_stat_statements both require shared_preload_libraries.
    # PostGIS does not. CNPG rolling-restarts pods automatically when this list
    # changes (see primaryUpdateStrategy below).
    shared_preload_libraries:
      - timescaledb
      - pg_stat_statements
    parameters:
      max_connections: "100"

  bootstrap:
    initdb:
      database: pmsonline
      owner: pmsonline
      # Must pre-exist in the target namespace as type kubernetes.io/basic-auth
      # (keys: username, password). Dev: committed in overlays/dev/. Prod: created
      # manually, never committed — see overlays/prd/secret-pmsonline-credentials.yaml.example
      # and README.md.
      secret:
        name: pmsonline-credentials
      # Runs once, after the pmsonline database is created (NOT postInitSQL, which
      # runs earlier against template1/before the app database exists).
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS postgis;"
        - "CREATE EXTENSION IF NOT EXISTS timescaledb;"
        - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
        - "CREATE EXTENSION IF NOT EXISTS vector;"

  storage:
    size: 20Gi # overridden per overlay
    storageClass: longhorn # overridden per overlay

  resources: # overridden per overlay
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

  # Lets CNPG automatically roll pods when shared_preload_libraries (or other
  # restart-requiring config) changes, without manual intervention.
  primaryUpdateStrategy: unsupervised

  # enableSuperuserAccess intentionally left at CNPG's default (false) — avoids a
  # floating superuser credential; `kubectl cnpg psql` covers normal admin needs.

  # backup: intentionally omitted for now — no S3/MinIO object storage available yet.
  # There is currently NO automated disaster recovery for this cluster.
  # See README.md "Known gaps" for the exact stanza to add once storage exists.
