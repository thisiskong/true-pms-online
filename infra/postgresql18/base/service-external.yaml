# Additional externally-reachable Service, separate from CNPG's own in-cluster-only
# <cluster>-rw / -ro / -r Services. Selector uses CNPG's own pod labels so this
# always tracks the current primary through failovers, the same way the -rw
# Service does. type/nodePort are set per overlay; switching to LoadBalancer later
# (e.g. if MetalLB becomes available) is a one-line patch — see README.md.
apiVersion: v1
kind: Service
metadata:
  name: pg18-pms-external
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: pg18-pms
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
