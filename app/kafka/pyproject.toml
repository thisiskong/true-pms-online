[project]
name = "kafka-nokia"
version = "0.1.0"
description = "Nokia Altiplano Kafka consumer for PMS"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.14.2",
    "pyyaml>=6.0.3",
    # rocksdb is Linux-only (Cython extension); install manually on target host:
    #   pip install rocksdb
]

[project.scripts]
kafka-nokia = "kafka_nokia:main"
