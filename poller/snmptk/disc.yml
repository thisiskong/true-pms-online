setting:
  # postgres database configuration
  dbConnection: "host=10.50.238.194 port=5432 dbname=pmsonline user=pmsonline password=pmsonline sslmode=disable connect_timeout=5"
  # dbConnection: "host=10.50.238.84 port=5432 dbname=pmsonline user=pmsonline password=pmsonline#2022 sslmode=disable connect_timeout=5"
  
  # leveldb storage path
  levelDbBaseDir: /home/pms/online/level.db
  metricUrl: http://10.50.238.194:9091

  # --- rate limit ---
  # rate limit in IP per second
  # global rate limit
  rateLimit: 50
  # topology rate limit (default if not specify)
  topologyRateLimitDefault: 20
  # topology rate limit for each topology
  topologyRateLimit:
    DN: 10
    PN: 10
  # snmp discovery able to send multiple request for each host
  hostRateLimit: 1
  
  # --- zookeeper connection ---
  zk:
    host: tyb-pms-etl-dv01.pms:2181,tyb-pms-etl-dv02.pms:2181,tyb-pms-etl-dv03.pms:2181
    timeout: 10

  # --- data collector ---
  collector:
    # list of all data collector node
    hosts:
      - tyb-pms-etl-dv02.pms
    # logical group for data collector node
    groups:
      - name: MB
        nodes:
          - tyb-pms-etl-dv02.pms
      - name: BB
        nodes:
          - tyb-pms-etl-dv02.pms
      - name: NW
        nodes:
          - tyb-pms-etl-dv02.pms
      - name: FB
        nodes:
          - tyb-pms-etl-dv02.pms

# --- discovery ---
discovery:
  # Count tells pinger to stop after sending (and receiving) Count echo packets.
  icmpCount: 1
  # Interval (milliseconds) is the wait time between each packet send.
  icmpInterval: 500
  # Timeout (milliseconds) specifies a timeout before ping exits, regardless of how many packets have been received.
  icmpTimeout: 2000
  snmpOption:
    # snmp timeout (seconds)
    timeout: 10
    retries: 3
    maxRepetition: 10
    expTime: true

  # Production (Old):   http://10.50.25.178:7105/axis2/services/IM4GisService
  # Production (New):   http://10.50.25.128:7105/axis2/services/IM4GisService
  # Development:        http://172.19.208.107:7105/axis2/services/IM4GisService
  serviceApi:
    # service end-point, if not set, disable service api calling
    endpoint: http://10.50.25.128:7105/axis2/services/IM4GisService
    # endpoint: http://172.19.208.107:7105/axis2/services/IM4GisService
    # timeout in seconds
    timeout: 10

  snmpOids:
    - oid: .1.3.6.1.2.1.1.1.0
      name: sysDescr
      type: OctetString
    - oid: .1.3.6.1.2.1.1.5.0
      name: sysName
      type: OctetString
    - oid: .1.3.6.1.2.1.1.3.0
      name: sysUptime
      type: TimeTicks

  # vendor specific oids
  extSnmpOids:
    Default:
      - oid: .1.3.6.1.2.1.2.1.0
        name: ifNumber
        type: Integer
      - oid: .1.0.8802.1.1.2.1.3.2.0
